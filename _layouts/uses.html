---
layout: core
---

<div class="mb-16 mt-12 lg:mt-16">
    <div class="mx-auto max-w-2xl lg:max-w-5xl">
        <h1 class="text-5xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 mb-4">{{ page.headline }}</h1>
        <p class="text-zinc-600 dark:text-zinc-400 leading-7">{{ page.intro }}</p>
    </div>
</div>

<div class="mx-auto max-w-2xl lg:max-w-5xl">
    <div class="uses-content prose prose-zinc max-w-none dark:prose-invert">
        {{ content }}
    </div>
</div>

<style>
.uses-content h2 {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
    color: rgb(24 24 27);
    margin-top: 3rem;
    margin-bottom: 1.5rem;
}

.dark .uses-content h2 {
    color: rgb(244 244 245);
}

.uses-content h3 {
    font-size: 1.125rem;
    font-weight: 600;
    color: rgb(24 24 27);
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.dark .uses-content h3 {
    color: rgb(244 244 245);
}

.uses-content h3 .tool-icon {
    height: 2.5rem;
    width: 2.5rem;
    border-radius: 0.5rem;
    background-color: rgb(243 232 255);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.dark .uses-content h3 .tool-icon {
    background-color: rgba(139, 92, 246, 0.1);
}

.uses-content h3 .tool-icon i {
    font-size: 1.25rem;
    color: rgb(124 58 237);
}

.dark .uses-content h3 .tool-icon i {
    color: rgb(196 181 253);
}

.uses-content p {
    color: rgb(82 82 91);
    line-height: 1.75;
    margin-bottom: 1.5rem;
    margin-left: 3.25rem;
}

.dark .uses-content p {
    color: rgb(161 161 170);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const iconMap = {
        'MacBook': 'fab fa-apple',
        'Monitor': 'fas fa-desktop',
        'Keyboard': 'fas fa-keyboard',
        'Mouse': 'fas fa-mouse-pointer',
        'Herman Miller': 'fas fa-couch',
        'Chair': 'fas fa-couch',
        'Cursor': 'fas fa-code',
        'Warp': 'fas fa-terminal',
        'Figma': 'fas fa-palette',
        'DBeaver': 'fas fa-database',
        'Raycast': 'fas fa-rocket',
        'Monosnap': 'fas fa-camera',
        'Rectangle': 'fas fa-window-maximize',
        'Alfred': 'fas fa-bolt'
    };
    
    const h3s = document.querySelectorAll('.uses-content h3');
    h3s.forEach(h3 => {
        const text = h3.textContent.trim();
        let iconClass = 'fas fa-circle';
        
        // Match tool names to icons
        for (const [key, icon] of Object.entries(iconMap)) {
            if (text.includes(key)) {
                iconClass = icon;
                break;
            }
        }
        
        // Create icon element
        const iconEl = document.createElement('i');
        iconEl.className = iconClass;
        
        // Create icon container
        const iconContainer = document.createElement('div');
        iconContainer.className = 'tool-icon';
        iconContainer.appendChild(iconEl);
        
        // Insert icon before text
        h3.insertBefore(iconContainer, h3.firstChild);
    });
});
</script>
