---
layout: core
---


<div class="mb-16 mt-12 lg:mt-16">
    <div class="mx-auto max-w-2xl lg:max-w-5xl">
        <h1 class="text-5xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 mb-4">{{ page.headline }}</h1>
        <p class="text-zinc-600 dark:text-zinc-300 leading-7">{{ page.intro }}</p>
    </div>
</div>

<div class="mx-auto max-w-2xl lg:max-w-5xl">
    <div class="uses-content prose prose-zinc max-w-none dark:prose-invert">
        {{ content }}
    </div>
</div>

<style>
.uses-content h2 {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
    color: rgb(24 24 27);
    margin-top: 3rem;
    margin-bottom: 1.5rem;
}

.dark .uses-content h2 {
    color: rgb(244 244 245);
}

.uses-content h3 {
    font-size: 1.125rem;
    font-weight: 600;
    color: rgb(24 24 27);
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.dark .uses-content h3 {
    color: rgb(244 244 245);
}

.uses-content h3 .tool-icon {
    height: 2.5rem;
    width: 2.5rem;
    border-radius: 0.5rem;
    background-color: rgb(243 232 255);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.dark .uses-content h3 .tool-icon {
    background-color: rgba(139, 92, 246, 0.1);
}

.uses-content h3 .tool-icon svg {
    color: rgb(124 58 237);
}

.dark .uses-content h3 .tool-icon svg {
    color: rgb(196 181 253);
}

.uses-content p {
    color: rgb(82 82 91);
    line-height: 1.75;
    margin-bottom: 1.5rem;
    margin-left: 3.25rem;
}

.dark .uses-content p {
    color: rgb(161 161 170);
}
</style>

        'Figma': '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M15.852 8.981h-4.588V0h4.588c2.476 0 4.49 2.014 4.49 4.49s-2.014 4.491-4.49 4.491zM12.735 7.51h3.117c1.665 0 3.019-1.355 3.019-3.019s-1.355-3.019-3.019-3.019h-3.117V7.51zm0 1.471H8.148c-2.476 0-4.49-2.014-4.49-4.49S5.672 0 8.148 0h4.588v8.981zm-4.587-7.51c-1.665 0-3.019 1.355-3.019 3.019s1.355 3.02 3.019 3.02h3.117V1.471H8.148zm4.587 15.019H8.148c-2.476 0-4.49-2.014-4.49-4.49s2.014-4.49 4.49-4.49h4.588v8.98zM8.148 8.981c-1.665 0-3.019 1.355-3.019 3.019s1.355 3.019 3.019 3.019h3.117V8.981H8.148zM15.852 8.981c-2.476 0-4.49-2.014-4.49-4.49s2.014-4.491 4.49-4.491V0H8.148C5.672 0 3.658 2.014 3.658 4.49s2.014 4.491 4.49 4.491h4.588V8.981zm-.196 7.51h-4.588v4.588c0 2.476 2.014 4.49 4.49 4.49s4.49-2.014 4.49-4.49-.002-4.588-4.392-4.588zM12.735 24c0-1.665 1.355-3.019 3.019-3.019s3.019 1.355 3.019 3.019-1.355 3.019-3.019 3.019-3.019-1.355-3.019-3.019z"/></svg>',

        'Rectangle': '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>',
        'Alfred': '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>'
    };
    
    const h3s = document.querySelectorAll('.uses-content h3');
    h3s.forEach(h3 => {
        const text = h3.textContent.trim();
        let iconSVG = '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>';
        
        // Match tool names to icons (case-insensitive)
        for (const [key, svg] of Object.entries(iconMap)) {
            if (text.toLowerCase().includes(key.toLowerCase())) {
                iconSVG = svg;
                break;
            }
        }
        
        // Create icon container
        const iconContainer = document.createElement('div');
        iconContainer.className = 'tool-icon';
        iconContainer.innerHTML = iconSVG;
        
        // Insert icon before text
        h3.insertBefore(iconContainer, h3.firstChild);
    });
});
</script>
